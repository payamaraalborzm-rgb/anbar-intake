<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<style>
:root{--n:#1e3a5f;--l:#d5dbe2;--g:#1f9d55;--bg:#f4f6f8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.dt{display:flex;gap:10px;margin-top:8px}
.dt button{flex:1;min-height:50px;border:0;border-radius:12px;background:#ffffff33;color:#fff;font-size:17px}
.dt .on{background:#fff;color:var(--n);font-weight:700}

.chips{display:flex;flex-wrap:wrap;gap:8px}

.chip.on{background:var(--n);color:#fff;font-weight:700}.chip.dn{border-color:var(--g);color:var(--g)}.chip.on.dn{color:#fff}
.g2{display:grid;grid-template-columns:1fr;gap:10px}
.st{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f8fafc;border:1px solid var(--l);border-radius:14px;padding:8px 10px}
.st label{flex:1;margin:0;font-size:17px;font-weight:600;color:#1c2530;line-height:1.5}
.fv{color:var(--n);font-weight:700;margin-right:6px}
.st div{display:flex;direction:ltr;flex:0 0 auto}
.st button{width:52px;height:52px;border:1px solid var(--l);background:#e8eef5;font-size:28px;line-height:1;color:var(--n)}
.st button:first-child{border-radius:12px 0 0 12px}.st button:last-child{border-radius:0 12px 12px 0}
.st button:active{background:#cfd9e6}
.st input{width:84px;height:52px;min-width:0;text-align:center;border:1px solid var(--l);border-left:0;border-right:0;font-size:22px;font-weight:700;padding:0;background:#fff}
textarea,select,.nt{width:100%;border:1px solid var(--l);border-radius:12px;padding:12px;font-size:17px;margin-top:8px;background:#fff}

.bx{background:#fff;border-radius:16px;padding:16px;width:100%;max-height:88vh;overflow:auto;font-size:17px}
.bx pre{direction:ltr;font-size:13px;white-space:pre-wrap}.ls div{padding:8px 0;border-bottom:1px solid var(--l)}
.bt{display:flex;gap:10px;margin-top:14px}.bt button{flex:1;min-height:54px;border-radius:12px;border:1px solid var(--l);background:#fff;font-size:17px}

</style></head><body>
<header><b>ثبت اطلاعات</b><div class="dt"></div><small id="off" style="display:none">خارج از بله: فقط پیش‌نمایش، چیزی ارسال نمی‌شود.</small></header>
<nav id="nav"></nav><main id="app"></main><div id="go"></div><div id="ov"></div><div id="ts"></div>
<script id="dbg">window.onerror=function(m,u,l,c){var a=document.getElementById("app");if(a)a.innerHTML='<pre style="direction:ltr;white-space:pre-wrap;padding:12px;color:#b00;font-size:12px">Error: '+m+' ('+l+':'+c+')</pre>'};</script>
<script>
(function(){
/* کلیدها باید عیناً با BALE_FORM_COLUMNS در auto_pipeline.py یکی باشند */
const TEAMS=["رحیمی- عمو هاشمی","داودمحمدی - سخندان","کارن دهقان","باقری","عبدالله زادگان","شکوهی-یوسفی","عزیزی-غفوری","پرهام","قاسمی","کریمی- نصیری- ارکانی","اسفندیاری","عادل پویا","نعمتیان","عرفان","طهماسبی","رضوی"];
const TEAMS_T=TEAMS.concat(["سجاد محمد نژاد","بهادر اصفهانی"]),BB=["سجاد محمد نژاد","بهادر اصفهانی"],CFG_ONLY=["پرهام","قاسمی"];
const CEN=["کاظمی","کوثر","نصرآبادی","محور"],KT=["قطعی فیبر","خرابی اسپلایس","خرابی اسپلیتر","خرابی FAT","سایر"];
const COUNTS=["داخلی","بیرونی","فیوژن","کانفیگ"];
const MAT=["کابل 2 کر داخلی","کابل 2 کر بیرونی","کابل 4 کر بیرونی","اسپلیتر 1:2","اسپلیتر 1:4","اسپلیتر 1:8","اسپلیتر 1:16","اسپلیتر 1:32","پیگتیل","آداپتور تکی","آداپتور دوبل","FAT 12","FAT 24","FAT 48","مودم Q2","مودم تک پورت","مودم دو پورت"];
const mt=k=>/^کابل \d کر/.test(k)?k+" (متر)":k,TA=MAT.map(mt);
const B=["میکروداکت 4 کاناله","میکروداکت 7 کاناله","میکرو فیبر 12","میکرو فیبر 24","میکروفیبر 48","میکروفیبر 72","کابل 12 خاکی","کابل 24 خاکی","کابل 48 خاکی","کابل 72 خاکی","کابل 144 خاکی","کابل 12 کانالی","کابل 24 کانالی","کابل 48 کانالی","کابل 72 کانالی","کابل 144 کانالی","مفصل 12","مفصل 24","مفصل 48","مفصل 72","مفصل 144","سابداکت","لوله پلی اتیلن","لوله پست","FAT 12 (بهادر/سجاد)","FAT 24 (بهادر/سجاد)","FAT 48 (بهادر/سجاد)"];
const MK=TA.concat(["لوله پست","رزرو 1","رزرو 2"],B.slice(0,23)),SAJ=["پیگتیل","FAT 12","FAT 24","FAT 48","لوله پست","رزرو 1","رزرو 2"];
const PREF=["پیگتیل","FAT 48","کابل 2 کر بیرونی (متر)","آداپتور تکی","آداپتور دوبل","کابل 2 کر داخلی (متر)","اسپلیتر 1:4","اسپلیتر 1:8","اسپلیتر 1:2","اسپلیتر 1:16","مودم Q2","مودم تک پورت","مودم دو پورت"];
const RS=["بارندگی/شرایط جوی","تعطیلی","نبود متریال","نبود مجوز/هماهنگی","مرخصی/غیبت نیرو","خرابی خودرو/تجهیزات","سایر"];
const FM={ops:"ورودی گوگل عملیات",tah:"ورودی گوگل تحویلی",mar:"ورودی گوگل خرید مرکزی",saj:"ورودی گوگل سجاد",kh:"ورودی گوگل خرابی"};
const NOTE="توضیحات- علت عدم انجام کار",TN={ops:"عملکرد روزانه",zero:"بدون‌کار",kh:"خرابی",tah:"تحویلی اکیپ",mar:"خرید مرکزی",saj:"مصرفی سجاد"};
//--UI
const $=(s,e=document)=>e.querySelector(s),el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const U=new URLSearchParams(location.search).get("u")||"",TB={j:["ops","zero","kh"],n:["tah","mar"],b:["saj"]},tabs=TB[U]||Object.keys(TN);
const teams=()=>{if(wd()>=CUT)return TEAMS;const o=[];TEAMS.forEach(t=>{if(t==="باقری")o.push(OLDC);else if(t!=="عبدالله زادگان")o.push(t)});return o},teamsT=()=>teams().concat(BB);
const BALE=!!(window.Bale&&window.Bale.WebApp),app=$("#app"),go=$("#go"),ov=$("#ov"),S={};let tab=tabs[0],W=0;
if(!BALE)$("#off").style.display="block";
const CUT="2026-10-10",OLDC="امیرباقری"; /* از این تاریخ (۱۸ مهر ۱۴۰۵، شامل امروز)، «امیرباقری-عبدالله زادگان» دو اکیپ جدا (باقری، عبدالله زادگان) می‌شود */
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmt=(d,o)=>{try{return new Intl.DateTimeFormat("fa-IR-u-ca-persian",o).format(d)}catch(e){return iso(d)}};
const T0=new Date(),T1=new Date(T0.getTime()-864e5),wdt=()=>W?T1:T0,wd=()=>iso(wdt());
const nd=s=>String(s).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace("٫",".");
const isM=k=>k.includes("(متر)"),KEY=()=>"d:"+wd();
const getDone=()=>{try{return JSON.parse(localStorage.getItem(KEY())||"[]")}catch(e){return[]}};
const addDone=a=>{try{localStorage.setItem(KEY(),JSON.stringify([...new Set(getDone().concat(a))]))}catch(e){}};
const getVals=r=>{const o={};r.querySelectorAll("input[data-k]").forEach(i=>o[i.dataset.k]=parseFloat(i.value)||0);return o};
const setVals=(r,o)=>r.querySelectorAll("input[data-k]").forEach(i=>{if(o[i.dataset.k]!=null)i.value=o[i.dataset.k]});
const cab=k=>/^کابل/.test(k)||isM(k),pa=k=>/پیگتیل|آداپتور/.test(k);
const stepFor=k=>tab==="mar"?(cab(k)?1000:pa(k)?100:10):tab==="tah"?(cab(k)?100:pa(k)?10:1):(cab(k)?10:1);
const soft=k=>tab==="mar"?(cab(k)?(k.includes("داخلی")?150000:k.includes("4 کر")?70000:90000):pa(k)?15000:1500):tab==="tah"?(cab(k)?12000:/میکروداکت/.test(k)?3500:pa(k)?1000:200):tab==="saj"?2000:(cab(k)?8000:300);
const f3=x=>Number(x).toLocaleString("en-US");
const stp=k=>{const m=isM(k),w=el("div","st",`<label>${k}<span class="fv"></span></label><div><button type="button" data-d="-1">−</button><input inputmode="${m?"decimal":"numeric"}" value="0" data-k="${k}" ${m?'data-m="1"':""}><button type="button" data-d="1">+</button></div>`);w.dataset.s=stepFor(k);return w};
const grid=(ks)=>{const g=el("div","g2");ks.forEach(k=>g.append(stp(k)));return g};
const note=p=>Object.assign(el("textarea"),{placeholder:p||"توضیحات (اختیاری)"});
const chips=(arr,cur,fn,done)=>{const c=el("div","chips");arr.forEach(t=>{const d=done&&done.includes(t),b=el("button","chip"+(cur===t?" on":"")+(d?" dn":""),(d?"✓ ":"")+t);b.type="button";b.onclick=()=>fn(t);c.append(b)});return c};
const setGo=(t,f)=>{go.style.display=t?"block":"none";go.innerHTML=t?`<button type="button">${t}</button>`:"";if(t)go.firstChild.onclick=f};
const toast=t=>{const e=$("#ts");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1800)};
const lines=v=>Object.keys(v).filter(k=>v[k]>0).map(k=>`${k}: <b>${f3(v[k])}</b>${v[k]>soft(k)?" ⚠ عدد بزرگ، چند صفر دارد؟":""}`);
const big=v=>Object.values(v).some(x=>x>9999999);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const tsn=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return iso(d)+" "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds())};
document.addEventListener("click",e=>{const b=e.target.closest(".st button");if(!b)return;const i=b.parentNode.querySelector("input"),s=+b.closest(".st").dataset.s;i.value=Math.max(0,Math.round(((parseFloat(i.value)||0)+b.dataset.d*s)*100)/100);i.dispatchEvent(new Event("input",{bubbles:true}))});
document.addEventListener("input",e=>{const i=e.target;if(!(i.dataset&&i.dataset.k))return;i.value=nd(i.value).replace(i.dataset.m?/[^0-9.]/g:/[^0-9]/g,"");const fv=i.closest(".st").querySelector(".fv"),n=parseFloat(i.value)||0;fv.textContent=n>=1000?f3(n):""});
document.addEventListener("focusin",e=>{if(e.target.dataset&&e.target.dataset.k)e.target.select()});
document.addEventListener("focusout",e=>{if(e.target.dataset&&e.target.dataset.k&&e.target.value==="")e.target.value="0"});

function confirmSend(title,ls,form,fields,rows,after,raw){
  if(!ls.length)return;
  const cid=uid(),box=el("div","bx",`<h3>${title}</h3>${raw?(raw.__work_date__?"<p>تاریخ کار: <b>"+raw.__work_date__+"</b></p>":""):`<p>تاریخ کار: <b>${W?"دیروز":"امروز"} ${fmt(wdt(),{day:"numeric",month:"long"})}</b></p>`}<div class="ls">${ls.some(l=>l.includes("⚠"))?"<div style=\"color:#c0392b;font-weight:700\">⚠ یک یا چند عدد از حد معمول بزرگ‌تره؛ یک‌بار دیگه چک کن.</div>":""}${ls.map(l=>"<div>"+l+"</div>").join("")}</div><div class="bt"><button type="button" id="ok">${ls.some(l=>l.includes("⚠"))?"عددها را چک کردم، ارسال":"تأیید و ارسال"}</button><button type="button" id="no">بازگشت</button></div>`);
  ov.innerHTML="";ov.append(box);ov.style.display="flex";
  $("#no").onclick=()=>ov.style.display="none";
  $("#ok").onclick=function(){
    this.disabled=true;
    const base={__form__:form,__v__:2,__cid__:cid,__day__:W,__work_date__:wd(),Timestamp:tsn(),"ماه":fmt(wdt(),{month:"long"})};
    const payload=raw?Object.assign({Timestamp:tsn()},raw):rows?Object.assign(base,{rows}):Object.assign(base,fields);
    if(!BALE){box.innerHTML="<h3>پیش‌نمایش (ارسال نشد)</h3><pre>"+JSON.stringify(payload,null,1)+'</pre><div class="bt"><button type="button" id="c2">بستن</button></div>';$("#c2").onclick=()=>ov.style.display="none";return}
    try{Bale.WebApp.sendData(JSON.stringify(payload));ov.style.display="none";toast("✅ ثبت شد");after()}catch(err){this.disabled=false;alert("ارسال ناموفق: "+err.message)}
  };
}

function vOps(){
  const keep=getVals(app),d=getDone();app.innerHTML="";
  app.append(el("h3",0,"اکیپ"),chips(teams(),S.crew,t=>{S.crew=t;S.all=0;V()},d));
  if(!S.crew)return setGo("");
  const cfg=CFG_ONLY.includes(S.crew)&&!S.all,box=el("div","card");
  box.append(grid(cfg?["کانفیگ"]:COUNTS));
  if(cfg){const m=el("button","lnk","نمایش همه‌ی فیلدها");m.type="button";m.onclick=()=>{S.all=1;V()};box.append(m)}
  else box.append(el("h4",0,"متریال مصرفی"),grid(MAT));
  const nt=note();box.append(nt);app.append(box);setVals(app,keep);
  setGo("بررسی و ارسال",()=>{
    const v=getVals(box),ks=COUNTS.concat(MAT),f={"نام اکیپ":S.crew};ks.forEach(k=>f[k]=String(v[k]||0));f[NOTE]=nt.value.trim();
    if(!ks.some(k=>v[k]>0))return alert("همه‌ی اعداد صفره. اگر اکیپ کار نداشته، از تب «بدون‌کار» ثبتش کن.");
    if(big(v))return alert("یک عدد بیش از حد بزرگه، دوباره چک کن.");
    if(getDone().includes(S.crew)&&!confirm("این اکیپ برای این تاریخ قبلاً ثبت شده. دوباره ثبت شود؟"))return;
    confirmSend(S.crew,lines(v),FM.ops,f,0,()=>{addDone([S.crew]);S.crew=teams().find(t=>!getDone().includes(t))||"";S.all=0;V()});
  });
}

function vZero(){
  app.innerHTML="";const td=teams().filter(t=>!getDone().includes(t));
  if(!td.length){app.append(el("p","mt","همه‌ی اکیپ‌ها برای این تاریخ ثبت شده‌اند ✓"));return setGo("")}
  app.append(el("p","mt","اکیپ‌هایی که کاری نداشتند را تیک بزن و دلیلشان را انتخاب کن."));
  td.forEach(t=>{const r=el("div","card zr",`<label><input type="checkbox" data-t="${t}"> ${t}</label><div class="zd" style="display:none"><select><option value="">دلیل؟</option>${RS.map(x=>`<option>${x}</option>`).join("")}</select><input class="nt" placeholder="توضیح (اختیاری)"></div>`);
    r.querySelector("input").onchange=e=>r.querySelector(".zd").style.display=e.target.checked?"block":"none";app.append(r)});
  setGo("بررسی و ارسال",()=>{
    const rows=[],nm=[];let bad=0;
    app.querySelectorAll(".zr").forEach(r=>{const c=r.querySelector("input");if(!c.checked)return;const s=r.querySelector("select").value,n=r.querySelector(".nt").value.trim();
      if(!s||(s==="سایر"&&!n))bad=1;const f={"نام اکیپ":c.dataset.t};COUNTS.concat(MAT).forEach(k=>f[k]="0");f[NOTE]=s+(n?": "+n:"");rows.push(f);nm.push(c.dataset.t+" — "+s)});
    if(!rows.length)return alert("هیچ اکیپی تیک نخورده.");
    if(bad)return alert("برای هر اکیپ دلیل لازم است (برای «سایر» توضیح هم بنویس).");
    confirmSend("بدون‌کار: "+rows.length+" اکیپ",nm,FM.ops,0,rows,()=>{addDone(rows.map(r=>r["نام اکیپ"]));V()});
  });
}

function vKh(){
  const keep=getVals(app);app.innerHTML="";
  app.append(el("h3",0,"مرکز"),chips(CEN,S.cen,t=>{S.cen=t;V()}));
  if(!S.cen)return setGo("");
  const box=el("div","card");box.append(grid(KT));const nt=note();box.append(nt);app.append(box);setVals(app,keep);
  setGo("بررسی و ارسال",()=>{
    const v=getVals(box),rows=KT.filter(k=>v[k]>0).map(k=>({"مرکز":S.cen,"نوع خرابی":k,"تعداد":String(v[k]),"توضیحات":nt.value.trim()}));
    if(!rows.length)return alert("هیچ خرابی‌ای وارد نشده.");
    if(big(v))return alert("یک عدد بیش از حد بزرگه.");
    confirmSend("خرابی "+S.cen,lines(v),FM.kh,0,rows,()=>{S.cen="";V()});
  });
}

function vPick(kind){
  const keep=getVals(app);app.innerHTML="";
  let keys=MK,pref=PREF,ex={},form=FM.mar,title="خرید مرکزی";
  if(kind==="tah"){
    app.append(el("h3",0,"اکیپ"),chips(teamsT(),S.team,t=>{S.team=t;S.it=[];V()}));
    if(!S.team)return setGo("");
    const b=BB.includes(S.team);keys=b?B:TA;pref=b?B.slice(23):PREF;ex={"نام اکیپ":S.team};form=FM.tah;title="تحویل به "+S.team;
  }
  S.it=S.it||[];
  const box=el("div","card");box.append(el("h4",0,"اقلام این ثبت"));
  if(S.it.length)box.append(grid(S.it));else box.append(el("p","mt","قلم‌ها را از پایین اضافه کن؛ بقیه خودکار صفر ثبت می‌شوند."));
  const add=k=>{S.it.push(k);V()},rest=keys.filter(k=>!S.it.includes(k));
  box.append(chips(pref.filter(k=>!S.it.includes(k)),"",add));
  const mb=el("button","lnk",S.more?"بستن سایر اقلام":"سایر اقلام ▾");mb.type="button";mb.onclick=()=>{S.more=!S.more;V()};box.append(mb);
  if(S.more)box.append(chips(rest.filter(k=>!pref.includes(k)),"",add));
  const nt=note();box.append(nt);app.append(box);setVals(app,keep);
  setGo("بررسی و ارسال",()=>{
    const v=getVals(box),f=Object.assign({},ex);keys.forEach(k=>f[k]=String(v[k]||0));f["توضیحات"]=nt.value.trim();
    if(!keys.some(k=>v[k]>0))return alert("هیچ قلمی با مقدار بیشتر از صفر وارد نشده.");
    if(big(v))return alert("یک عدد بیش از حد بزرگه.");
    confirmSend(title,lines(v),form,f,0,()=>{S.it=[];S.more=0;V()});
  });
}

function vSaj(){
  app.innerHTML="";const box=el("div","card");box.append(el("h4",0,"مصرفی سجاد محمد نژاد"),grid(SAJ));const nt=note();box.append(nt);
  const nz=el("button","lnk","امروز مصرفی نداشتم");nz.type="button";
  nz.onclick=()=>{const f={"نام اکیپ":"سجاد محمد نژاد"};SAJ.forEach(k=>f[k]="0");f["توضیحات"]="بدون مصرف";confirmSend("بدون مصرف",["امروز مصرفی نداشتم"],FM.saj,f,0,()=>V())};
  box.append(nz);app.append(box);
  setGo("بررسی و ارسال",()=>{
    const v=getVals(box),f={"نام اکیپ":"سجاد محمد نژاد"};SAJ.forEach(k=>f[k]=String(v[k]||0));f["توضیحات"]=nt.value.trim();
    if(!SAJ.some(k=>v[k]>0))return alert("همه‌ی اعداد صفره.");
    if(big(v))return alert("یک عدد بیش از حد بزرگه.");
    confirmSend("مصرفی سجاد",lines(v),FM.saj,f,0,()=>V());
  });
}

function V(){
  if(S.crew&&!teams().includes(S.crew))S.crew="";
  if(S.team&&!teamsT().includes(S.team)){S.team="";S.it=[]}
  $(".dt").innerHTML="";
  [["امروز",T0],["دیروز",T1]].forEach((x,i)=>{const b=el("button",W===i?"on":"",x[0]+" "+fmt(x[1],{day:"numeric",month:"long"}));b.type="button";b.onclick=()=>{W=i;V()};$(".dt").append(b)});
  $("#nav").innerHTML="";
  if(tabs.length>1)tabs.forEach(t=>{const b=el("button",t===tab?"on":"",TN[t]);b.type="button";b.onclick=()=>{tab=t;S.it=[];S.more=0;app.innerHTML="";V()};$("#nav").append(b)});
  ({ops:vOps,zero:vZero,kh:vKh,tah:()=>vPick("tah"),mar:()=>vPick("mar"),saj:vSaj})[tab]();
}
/* ویرایش/ابطال: فقط با لینک دکمه‌ی پیام رسیدِ ربات برای ادمین باز می‌شود؛ سرور هم فقط چت ادمین را می‌پذیرد */
const AQ=new URLSearchParams(location.search),ACT=AQ.get("act");let AD=null;
try{let x=AQ.get("d").replace(/-/g,"+").replace(/_/g,"/");x+="=".repeat((4-x.length%4)%4);AD=JSON.parse(decodeURIComponent(escape(atob(x))))}catch(e){}
const FK=(f,v)=>f===FM.ops?COUNTS.concat(MAT):f===FM.tah?(BB.includes(v["نام اکیپ"])?B:TA):f===FM.mar?MK:f===FM.saj?SAJ:["تعداد"];
const IDK=["نام اکیپ","مرکز","نوع خرابی"];
function vAdmin(){
  $(".dt").style.display="none";$("#nav").style.display="none";
  const f=AD.f,v=AD.v||{},key=Object.keys(FM).find(k=>FM[k]===f)||"ops",isEdit=ACT==="edit"&&!AD.b,box=el("div","card");
  const done=()=>{app.innerHTML='<p class="mt">✅ ارسال شد. نتیجه را ربات با پیام تأیید می‌کند.</p>';setGo("")};
  app.append(el("h3",0,(isEdit?"ویرایش ثبت: ":"ابطال ثبت: ")+TN[key]));
  IDK.forEach(k=>{if(v[k])box.append(el("p","mt",k+": <b>"+v[k]+"</b>"))});
  if(AD.b)box.append(el("p","mt","این یک ثبت گروهی با <b>"+AD.b+"</b> ردیف است؛ ابطال، همه‌ی ردیف‌ها را حذف می‌کند."));
  tab=key;
  if(isEdit){
    const di=Object.assign(el("input","nt"),{type:"date",value:AD.w}),ks=FK(f,v),nk=f===FM.ops?NOTE:"توضیحات";
    box.append(el("p","mt","تاریخ کار (میلادی):"),di);const g=grid(ks);box.append(g);
    const nv={};ks.forEach(k=>nv[k]=parseFloat(v[k])||0);setVals(g,nv);g.querySelectorAll("input").forEach(i=>i.dispatchEvent(new Event("input",{bubbles:true})));
    const nt=note();nt.value=v[nk]||"";box.append(nt);app.append(box);
    setGo("بررسی و ارسال ویرایش",()=>{
      const vals=getVals(g),fl={};IDK.forEach(k=>{if(v[k])fl[k]=v[k]});ks.forEach(k=>fl[k]=String(vals[k]||0));fl[nk]=nt.value.trim();
      if(!di.value)return alert("تاریخ کار را وارد کن.");
      if(big(vals))return alert("یک عدد بیش از حد بزرگه.");
      if(!ks.some(k=>vals[k]>0))return alert("همه‌ی اعداد صفره؛ برای حذف از «ابطال» استفاده کن.");
      confirmSend("ویرایش ثبت",lines(vals).concat(["تاریخ کار: "+di.value]),f,0,0,done,Object.assign({__form__:f,__v__:2,__cid__:AD.c,__edit__:true,__work_date__:di.value},fl));
    });
  }else{
    Object.keys(v).forEach(k=>box.append(el("p","mt",k+": <b>"+v[k]+"</b>")));
    const rs=Object.assign(el("textarea"),{placeholder:"دلیل ابطال (اجباری)"});box.append(rs);app.append(box);
    setGo("ابطال نهایی",()=>{
      if(rs.value.trim().length<3)return alert("دلیل ابطال را بنویس.");
      confirmSend("ابطال ثبت",["شناسه: "+AD.c,"دلیل: "+rs.value.trim()],f,0,0,done,{__form__:f,__v__:2,__cid__:AD.c,__void__:true,reason:rs.value.trim()});
    });
  }
}
if(ACT&&AD)vAdmin();else V();
})();
</script></body></html>
